<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collecta · Lists</title>
  <style>
    :root { --bg:#0a0a0b; --panel:#111113; --card:#161619; --border:#26262b; --accent:#6366f1; --accent-hover:#818cf8;
      --text:#f4f4f5; --muted:#8b8b94; --ok:#3fb950; --danger:#e5484d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:36px 20px 8px; text-align:center; }
    header h1 { margin:0; font-size:28px; letter-spacing:.5px; font-weight:700; }
    header h1 a { color:inherit; text-decoration:none; }
    header h1 span { color:var(--accent); }
    header p { color:var(--muted); margin:8px 0 0; font-size:14px; }
    nav { display:flex; justify-content:center; gap:18px; margin-top:14px; font-size:14px; }
    nav a { color:var(--muted); text-decoration:none; }
    nav a.active, nav a:hover { color:var(--text); }
    main { max-width:860px; margin:0 auto; padding:16px 20px 60px; }
    .toolbar { display:flex; gap:10px; align-items:center; margin:12px 0 4px; }
    .toolbar input { flex:1; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel);
      color:var(--text); font-size:14px; }
    .toolbar input:focus { outline:none; border-color:#3a3a42; }
    .toolbar .muted { flex-shrink:0; }
    .muted { color:var(--muted); font-size:13px; }
    .item { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px; margin-top:8px; }
    .item:hover { border-color:#3a3a42; }
    .item .main { flex:1; min-width:0; text-decoration:none; color:var(--text); }
    .item .name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item .sub { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
    .item .meta { font-size:12px; color:var(--muted); margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
    .tag { font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:5px; padding:1px 6px; }
    .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:5px; background:#2a2f3a; color:#9aa4b2; }
    .pill.warn { background:rgba(210,153,34,.15); color:#d6a541; }
    .pill.err { background:rgba(229,72,77,.15); color:#e69090; }
    .actions { display:flex; gap:6px; flex-shrink:0; align-items:center; }
    a.btn, button.btn { display:inline-flex; align-items:center; height:32px; padding:0 12px; border-radius:8px; font-size:13px;
      border:1px solid var(--border); background:transparent; color:var(--text); text-decoration:none; cursor:pointer; font-family:inherit; }
    a.btn:hover, button.btn:hover { background:rgba(255,255,255,.05); }
    a.btn.sched-on { border-color:rgba(99,102,241,.6); background:rgba(99,102,241,.14); }
    a.btn.sched-on.paused { opacity:.6; }
    button.btn.danger { color:#e07a7d; }
    button.btn.danger:hover { background:rgba(229,72,77,.12); border-color:var(--danger); }
    .empty { color:var(--muted); font-size:14px; text-align:center; padding:24px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Collect<span>a</span></a></h1>
    <p>Every list you've analyzed &mdash; open it, or schedule it to pick up new titles automatically.</p>
    <nav><a href="/">Analyze a link</a><a href="/lists" class="active">Lists</a><a href="/schedules">Schedules</a></nav>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter by name or link…">
      <span class="muted" id="total"></span>
    </div>
    <div id="list"><div class="empty">Loading…</div></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let JOBS = [];
    function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
    const STATUS = { queued:'queued', ingesting:'analyzing', extracting:'analyzing', matching:'analyzing',
      awaiting_approval:'', done:'', error:'error' };
    const TARGET = { tmdb:'TMDB', radarr:'Radarr', kometa:'Kometa' };

    function freqLabel(h) {
      return ({24:'Daily', 168:'Weekly', 720:'Monthly'})[h] || (h % 24 === 0 ? 'Every ' + (h/24) + ' days' : 'Every ' + h + 'h');
    }

    function render() {
      const q = $('filter').value.trim().toLowerCase();
      const rows = JOBS.filter(j => !q || (j.list_name || '').toLowerCase().includes(q) || (j.source_url || '').toLowerCase().includes(q));
      $('total').textContent = rows.length + (rows.length === JOBS.length ? '' : ' of ' + JOBS.length) + ' lists';
      if (!rows.length) { $('list').innerHTML = '<div class="empty">' + (JOBS.length ? 'No matches.' : 'No lists yet.') + '</div>'; return; }
      $('list').innerHTML = rows.map(j => {
        const name = (j.list_name && j.list_name.trim()) || j.source_url || 'Untitled';
        const sub = j.content_type === 'pasted_text' ? 'Pasted text' : j.source_url;
        const st = STATUS[j.status];
        const s = j.schedule;
        const schedBtn = s
          ? '<a class="btn sched-on' + (s.enabled ? '' : ' paused') + '" href="/schedules#s-' + s.id + '" title="Manage schedule">\u21bb ' +
              freqLabel(s.interval_hours) + (s.enabled ? '' : ' (paused)') + '</a>'
          : (j.schedulable
              ? '<a class="btn" href="/schedules?job_id=' + encodeURIComponent(j.id) + '" title="Re-parse this link on a schedule">Schedule…</a>'
              : '<span class="muted" title="Pasted text has no link to re-fetch">not schedulable</span>');
        return '<div class="item">' +
          '<a class="main" href="/job/' + esc(j.id) + '">' +
            '<div class="name">' + esc(name) + '</div>' +
            '<div class="sub">' + esc(sub) + '</div>' +
            '<div class="meta">' +
              (st ? '<span class="pill' + (j.status === 'error' ? ' err' : '') + '">' + esc(st) + '</span>' : '') +
              (s && s.last_status === 'error' ? '<span class="pill err">last scheduled run failed</span>' : '') +
              '<span>' + j.count + ' titles · ' + j.approved + ' approved</span>' +
              (j.unmatched ? '<span class="pill warn">' + j.unmatched + ' unmatched</span>' : '') +
              j.published.map(t => '<span class="tag">' + (TARGET[t] || esc(t)) + '</span>').join(' ') +
              '<span>' + (j.created_at ? new Date(j.created_at).toLocaleDateString() : '') + '</span>' +
            '</div>' +
          '</a>' +
          '<div class="actions">' + schedBtn +
            '<button class="btn danger" data-id="' + esc(j.id) + '" title="Remove list (and its schedule)">\u2715</button>' +
          '</div></div>';
      }).join('');
      $('list').querySelectorAll('button.danger').forEach(b => b.onclick = () => removeJob(b.dataset.id));
    }

    async function removeJob(id) {
      const j = JOBS.find(x => x.id === id);
      const extra = j && j.schedule ? ' Its schedule is removed too.' : '';
      if (!confirm('Remove "' + ((j && j.list_name) || 'this list') + '" from Collecta?' + extra +
                   ' Already published TMDB/Radarr/Kometa lists are not deleted.')) return;
      await fetch('/api/jobs/' + id, { method: 'DELETE' });
      load();
    }

    async function load() {
      try { JOBS = (await (await fetch('/api/jobs')).json()).jobs || []; } catch (e) { JOBS = []; }
      render();
    }
    $('filter').addEventListener('input', render);
    load();
  </script>
</body>
</html>
